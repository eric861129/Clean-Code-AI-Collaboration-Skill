name: Validate Skill Structural Contract

on:
  push:
  pull_request:

jobs:
  test:
    name: Open Standard and Repository Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate Agent Skills open standard
        run: agentskills validate clean-code-ai-collaboration
